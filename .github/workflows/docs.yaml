name: Docs

on:
  push:
    branches:
      - main
    paths: &docs-paths
      - "docs/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "makefile"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches:
      - main
    paths: *docs-paths
  workflow_dispatch:

# No permissions by default; each job grants only what it needs.
permissions: {}

# One run at a time per branch or PR. New pushes to a PR cancel its running
# build, while runs on main queue so a deploy is never cancelled part way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads the Python version from .python-version and installs it.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Keep in sync with the uv version in .devcontainer/Dockerfile.
          version: "0.13.8"
          enable-cache: true
          restore-cache: true
          # Only main saves the cache, so pull requests don't use up cache storage.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      # The docs only import the package, so install its core dependencies and
      # the docs group, without the extras or the dev group.
      - name: Install the project and docs dependencies
        run: uv sync --locked --no-default-groups --group docs

      # Use the makefile's docs target so the Sphinx flags live in one place.
      # --no-sync stops uv run re-installing the default dependency groups.
      - name: Build the Sphinx docs
        run: make docs UV_RUN_DOCS="uv run --no-sync"

      # On pull requests, upload the built site so reviewers can download and
      # preview it from the workflow run's summary page.
      - name: Upload docs preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: docs/build
          retention-days: 3
          overwrite: true

      - name: Upload built docs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy pages to GitHub
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
